[pytest]

minversion = 7.0

;testpaths = tests tells pytest to look in tests/
testpaths = tests

;python_files, python_classes, python_functions define naming conventions
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

;addopts = -ra gives a compact summary for skipped/failed/xfailed tests
addopts = -ra

;markers registers custom markers so pytest does not warn about them
markers =
    unit: fast unit tests
    integration: tests that touch external systems
    slow: slow-running tests


