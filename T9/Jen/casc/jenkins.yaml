jenkins:
  systemMessage: "Local Jenkins for automation practice, managed by Docker and Configuration as Code."
  mode: NORMAL
  numExecutors: 2
  slaveAgentPort: 50000
  securityRealm: legacy
  authorizationStrategy: unsecured
  crumbIssuer:
    standard: {}
  remotingSecurity:
    enabled: true

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "${JENKINS_ADMIN_EMAIL}"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"