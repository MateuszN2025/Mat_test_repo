name: jenkins-local

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/jenkins-automation:lts
    container_name: jenkins-local
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc_configs/jenkins.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin-local-change-me}
      JENKINS_ADMIN_EMAIL: ${JENKINS_ADMIN_EMAIL:-admin@example.test}
      JENKINS_URL: ${JENKINS_URL:-http://127.0.0.1:8080/}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home: